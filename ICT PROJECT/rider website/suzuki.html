   // Function to reset view and return to initial state
   function back() {
            // Move all bike images out of view
            document.querySelectorAll('#image1, #image2, #image3, #image4').forEach(element => {
                element.style.left = '-110%';
                // element.style.transition = '0.1s ease-in';
                // element.style.display = 'none';
            });

            // Adjust card styles and content
            document.querySelector('.mid').style.height = '140vh';
            document.querySelectorAll('.card').forEach(function (card) {
                card.style.background = 'rgb(52 52 52)';
                card.style.boxShadow = '4px 8px 12px black';
            });

            // Reset positions of elements
            document.querySelectorAll('.down').forEach(function (down) {
                down.style.bottom = '0%';
            });
            document.querySelectorAll('.rimage').forEach(function (image) {
                image.style.left = '-18%';
            });

            document.querySelector('h4').style.left = '100%';
            document.querySelector('i').style.left = '-100%';
            document.querySelectorAll('p').forEach(function (p) {
                p.style.left = '-100%';
            });

            // Smooth transitions
            document.querySelectorAll('.rimage, .down').forEach(element => {
                element.classList.transition = '2s ease-in-out';
            });

            document.querySelector('.name').style.top = '-100%';
            document.querySelector('.name').style.transition = '.2s ease-in';
        }
